services:
  burrow:
    image: ghcr.io/nightshaman/burrow:latest
    pull_policy: always
    init: true
    user: "4226:4226"
    environment:
      HOME: /home/burrow
    ports:
      # Burrow has no UI authentication by default. Bind to loopback unless you
      # have explicitly configured authentication or a trusted reverse proxy.
      - "127.0.0.1:42817:42817"
      # Authenticated outbound Host Gateways connect to this controller port.
      # Restrict it with host/network firewalling to intended execution nodes.
      - "7443:7443"
    volumes:
      - burrow-data:/data

volumes:
  burrow-data:
