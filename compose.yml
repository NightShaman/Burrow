services:
  burrow:
    image: ghcr.io/nightshaman/burrow:latest
    pull_policy: always
    init: true
    ports:
      # Burrow has no UI authentication by default. Bind to loopback unless you
      # have explicitly configured authentication or a trusted reverse proxy.
      - "127.0.0.1:42817:42817"
    volumes:
      - burrow-data:/data

volumes:
  burrow-data:
