name: Assemble Burrow

on:
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Burrow-Backend commit SHA (defaults to its main branch)
        required: false
      ui_sha:
        description: Burrow-UI commit SHA (defaults to its main branch)
        required: false

permissions:
  contents: write
  packages: write

# Assembly publishes generated files back to main. Serialize publishers so two
# source-update dispatches cannot both build from stale main and race the push.
concurrency:
  group: burrow-assembly-main
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source revisions
        id: revisions
        env:
          EVENT_SOURCE: ${{ github.event.client_payload.source_repository }}
          EVENT_SHA: ${{ github.event.client_payload.source_sha }}
          INPUT_BACKEND_SHA: ${{ inputs.backend_sha }}
          INPUT_UI_SHA: ${{ inputs.ui_sha }}
          EVENT_NODE_GOBLIN_VERSION: ${{ github.event.client_payload.node_goblin_version }}
          GH_TOKEN: ${{ secrets.BURROW_SOURCE_TOKEN }}
        run: |
          set -eu
          backend_ref="$INPUT_BACKEND_SHA"
          ui_ref="$INPUT_UI_SHA"
          if [ "$EVENT_SOURCE" = "NightShaman/Burrow-Backend" ] && [ -n "$EVENT_SHA" ]; then backend_ref="$EVENT_SHA"; fi
          if [ "$EVENT_SOURCE" = "NightShaman/Burrow-UI" ] && [ -n "$EVENT_SHA" ]; then ui_ref="$EVENT_SHA"; fi
          if [ -z "$backend_ref" ]; then backend_ref=$(gh api repos/NightShaman/Burrow-Backend/commits/main --jq .sha); fi
          if [ -z "$ui_ref" ]; then ui_ref=$(gh api repos/NightShaman/Burrow-UI/commits/main --jq .sha); fi
          printf 'backend=%s\nui=%s\nnode_goblin_version=%s\n' "$backend_ref" "$ui_ref" "$EVENT_NODE_GOBLIN_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          path: assembled
      - uses: actions/checkout@v4
        with:
          repository: NightShaman/Burrow-Backend
          ref: ${{ steps.revisions.outputs.backend }}
          token: ${{ secrets.BURROW_SOURCE_TOKEN }}
          path: backend-source
      - uses: actions/checkout@v4
        with:
          repository: NightShaman/Burrow-UI
          ref: ${{ steps.revisions.outputs.ui }}
          token: ${{ secrets.BURROW_SOURCE_TOKEN }}
          path: ui-source
      - uses: actions/checkout@v4
        with:
          repository: NightShaman/burrow-mod-remote-nodes
          token: ${{ secrets.BURROW_SOURCE_TOKEN }}
          path: remote-nodes-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend-source/package-lock.json
            ui-source/package-lock.json
      - name: Verify sources
        run: |
          set -eu
          (cd backend-source && npm ci && npm test)
          (cd ui-source && npm ci && npm test)
      - name: Stamp and build generated release
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Generated assemblies own their release identifier. Assign the next
          # available UTC calendar revision automatically. The checked-in
          # version also counts so adopting release records after an existing
          # same-day build starts at .1 rather than reusing the bare date.
          base=$(date -u +%Y.%m.%d)
          version=$base
          suffix=0
          current=$(node -p "require('./assembled/backend/package.json').version")
          while [ "$version" = "$current" ] \
            || gh release view "v$version" >/dev/null 2>&1 \
            || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; do
            suffix=$((suffix + 1))
            version="$base.$suffix"
          done
          BUILD_VERSION="$version"
          BUILD_VERSION="$BUILD_VERSION" node -e "const fs=require('fs'); for (const dir of ['backend-source','ui-source']) { for (const name of ['package.json','package-lock.json']) { const f=dir+'/'+name, p=JSON.parse(fs.readFileSync(f)); p.version=process.env.BUILD_VERSION; if (p.packages?.['']) p.packages[''].version=process.env.BUILD_VERSION; fs.writeFileSync(f, JSON.stringify(p, null, 2)+'\\n'); } }"
          printf "// Generated by GitHub assembly. Do not edit in source.\nexport const releaseVersion = '%s';\n" "$BUILD_VERSION" > backend-source/src/release-version.mjs
          (cd ui-source && npm run build)
          printf 'version=%s\n' "$BUILD_VERSION" >> "$GITHUB_OUTPUT"
      - name: Materialize deployment payload
        run: |
          set -eu
          cd assembled
          rm -rf backend ui Dockerfile docker-entrypoint.sh compose.yml .dockerignore install.sh install-node-goblin.sh README.md burrow-logo.png SOURCE_VERSIONS
          mkdir backend ui
          for path in bin global-skills public scripts src; do cp -a "../backend-source/$path" "backend/$path"; done
          cp -a ../backend-source/package.json ../backend-source/package-lock.json backend/
          for path in src public dist; do cp -a "../ui-source/$path" "ui/$path"; done
          cp -a ../ui-source/package.json ../ui-source/package-lock.json ../ui-source/index.html ../ui-source/tsconfig.json ../ui-source/vite.config.ts ui/
          cp ../backend-source/deploy/installer/install.sh install.sh
          cp ../backend-source/deploy/installer/install-node-goblin.sh install-node-goblin.sh
          chmod 0755 install.sh install-node-goblin.sh
          cp ../backend-source/deploy/README.md README.md
          cp ../ui-source/public/burrow-logo.png burrow-logo.png
          cp ../backend-source/deploy/docker/Dockerfile Dockerfile
          cp ../backend-source/deploy/docker/docker-entrypoint.sh docker-entrypoint.sh
          cp ../backend-source/deploy/docker/compose.yml compose.yml
          cp ../backend-source/deploy/docker/.dockerignore .dockerignore
          printf 'Burrow-Build-Version %s\nBurrow-Backend %s\nBurrow-UI %s\n' "${{ steps.build.outputs.version }}" "${{ steps.revisions.outputs.backend }}" "${{ steps.revisions.outputs.ui }}" > SOURCE_VERSIONS
      - name: Commit generated assembly
        id: publish
        run: |
          set -eu
          cd assembled
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: assemble Burrow"
            # Main may advance while source verification/building runs. Rebase
            # the generated commit onto the current remote before publishing;
            # never turn a harmless race into a failed assembly or force-push.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish public Node Goblin release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # The public Burrow repository owns this tag namespace. Package a
          # Node Goblin source update under the assembly's assigned calendar
          # revision—not the source repository's independently assigned one—so
          # it cannot collide with an existing Burrow release tag.
          if [ -z "${{ steps.revisions.outputs.node_goblin_version }}" ]; then
            # Non-Node-Goblin assemblies do not mint another daemon release.
            exit 0
          fi
          version="${{ steps.build.outputs.version }}"
          printf '%s\n' "$version" > remote-nodes-source/gateway/VERSION
          tag="v$version"
          SOURCE_DATE_EPOCH=$(git -C remote-nodes-source show -s --format=%ct HEAD) \
            remote-nodes-source/gateway/deploy/build-release.sh remote-nodes-source/gateway/dist
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "Node Goblin $version" \
            --notes "Calendar-versioned Node Goblin release $version from source $(git -C remote-nodes-source rev-parse HEAD)." \
            "remote-nodes-source/gateway/dist/node-goblin-$version.tar.gz" \
            "remote-nodes-source/gateway/dist/node-goblin-$version.tar.gz.sha256"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: assembled
          push: true
          tags: |
            ghcr.io/nightshaman/burrow:latest
            ghcr.io/nightshaman/burrow:${{ steps.build.outputs.version }}
            ghcr.io/nightshaman/burrow:sha-${{ steps.publish.outputs.commit }}
      - name: Publish calendar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -eu
          tag="v$VERSION"
          git -C assembled tag "$tag" "$COMMIT"
          git -C assembled push origin "$tag"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Burrow $VERSION" \
            --notes "Calendar-versioned Burrow release $VERSION assembled at $COMMIT. Image: ghcr.io/nightshaman/burrow:$VERSION"
