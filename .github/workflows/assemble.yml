name: Assemble Burrow

on:
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Burrow-Backend commit SHA (defaults to its main branch)
        required: false
      ui_sha:
        description: Burrow-UI commit SHA (defaults to its main branch)
        required: false

permissions:
  contents: write
  packages: write

# Assembly publishes generated files back to main. Serialize publishers so two
# source-update dispatches cannot both build from stale main and race the push.
concurrency:
  group: burrow-assembly-main
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Read current pins only after this serialized job starts.
          ref: main
          path: assembled
      - name: Resolve source revisions
        id: revisions
        env:
          EVENT_SOURCE: ${{ github.event.client_payload.source_repository }}
          EVENT_SHA: ${{ github.event.client_payload.source_sha }}
          EVENT_REF: ${{ github.event.client_payload.source_ref }}
          INPUT_BACKEND_SHA: ${{ inputs.backend_sha }}
          INPUT_UI_SHA: ${{ inputs.ui_sha }}
          EVENT_NODE_GOBLIN_VERSION: ${{ github.event.client_payload.node_goblin_version }}
          GH_TOKEN: ${{ secrets.BURROW_SOURCE_TOKEN }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "$EVENT_REF" != "main" ]; then
            echo 'Automatic assembly requires source_ref=main' >&2
            exit 1
          fi
          backend_ref="$INPUT_BACKEND_SHA"
          ui_ref="$INPUT_UI_SHA"
          if [ "$EVENT_SOURCE" = "NightShaman/Burrow-Backend" ] && [ -n "$EVENT_SHA" ]; then backend_ref="$EVENT_SHA"; fi
          if [ "$EVENT_SOURCE" = "NightShaman/Burrow-UI" ] && [ -n "$EVENT_SHA" ]; then ui_ref="$EVENT_SHA"; fi
          if [ -z "$backend_ref" ]; then backend_ref=main; fi
          if [ -z "$ui_ref" ]; then ui_ref=main; fi
          # Resolve even explicitly supplied refs before comparing, gating or checkout.
          backend_ref=$(gh api "repos/NightShaman/Burrow-Backend/commits/$backend_ref" --jq .sha)
          ui_ref=$(gh api "repos/NightShaman/Burrow-UI/commits/$ui_ref" --jq .sha)
          node_goblin_ref=$(gh api repos/NightShaman/Node-Goblin/commits/main --jq .sha)
          # A queued older dispatch must never roll a recorded component backward.
          for item in "backend NightShaman/Burrow-Backend $backend_ref" "ui NightShaman/Burrow-UI $ui_ref"; do
            set -- $item; recorded=$(awk -v key="Burrow-${1^}" '$1==key {print $2}' assembled/SOURCE_VERSIONS 2>/dev/null || true)
            if [ -n "$recorded" ] && [ "$recorded" != "$3" ]; then
              status=$(gh api "repos/$2/compare/$recorded...$3" --jq .status)
              [ "$status" = ahead ] || { echo "Refusing non-forward $1 pin: $recorded -> $3 ($status)" >&2; exit 1; }
            fi
          done
          printf 'backend=%s\nui=%s\nnode_goblin=%s\nnode_goblin_version=%s\n' "$backend_ref" "$ui_ref" "$node_goblin_ref" "$EVENT_NODE_GOBLIN_VERSION" >> "$GITHUB_OUTPUT"
      - name: Require trusted component CI for exact resolved SHAs
        env:
          GH_TOKEN: ${{ secrets.BURROW_SOURCE_TOKEN }}
          COMPONENT_CI_TIMEOUT_MS: ${{ vars.COMPONENT_CI_TIMEOUT_MS || '3600000' }}
        run: |
          node --test assembled/scripts/assembly/component-gate.test.mjs
          node assembled/scripts/assembly/component-gate.mjs NightShaman/Burrow-Backend "${{ steps.revisions.outputs.backend }}"
          node assembled/scripts/assembly/component-gate.mjs NightShaman/Burrow-UI "${{ steps.revisions.outputs.ui }}"
      - uses: actions/checkout@v4
        with:
          repository: NightShaman/Burrow-Backend
          ref: ${{ steps.revisions.outputs.backend }}
          token: ${{ secrets.BURROW_SOURCE_TOKEN }}
          path: backend-source
      - uses: actions/checkout@v4
        with:
          repository: NightShaman/Burrow-UI
          ref: ${{ steps.revisions.outputs.ui }}
          token: ${{ secrets.BURROW_SOURCE_TOKEN }}
          path: ui-source
      - uses: actions/checkout@v4
        with:
          repository: NightShaman/Node-Goblin
          ref: ${{ steps.revisions.outputs.node_goblin }}
          token: ${{ secrets.BURROW_SOURCE_TOKEN }}
          path: node-goblin-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend-source/package-lock.json
            ui-source/package-lock.json
      - name: Install PostgreSQL 17 and pgvector for disposable integration fixtures
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-client-17 postgresql-17-pgvector
      - name: Verify sources
        env:
          BURROW_TEST_TIMEOUT_MS: '600000'
          BURROW_TEST_DISPOSABLE_POSTGRES: '1'
        run: |
          set -eu
          (cd backend-source && npm ci && npm test)
          # UI contract tests import the exact backend browser policy through
          # the sibling layout used by the component repository workflow.
          ln -s backend-source Burrow-Backend
          (cd ui-source && npm ci && npm test)
      - name: Stamp and build generated release
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Generated assemblies own their release identifier. Assign the next
          # available UTC calendar revision automatically. The checked-in
          # version also counts so adopting release records after an existing
          # same-day build starts at .1 rather than reusing the bare date.
          base=$(date -u +%Y.%m.%d)
          version=$base
          suffix=0
          current=$(node -p "require('./assembled/backend/package.json').version")
          while [ "$version" = "$current" ] \
            || gh release view "v$version" >/dev/null 2>&1 \
            || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; do
            suffix=$((suffix + 1))
            version="$base.$suffix"
          done
          BUILD_VERSION="$version"
          BUILD_VERSION="$BUILD_VERSION" node -e "const fs=require('fs'); for (const dir of ['backend-source','ui-source']) { for (const name of ['package.json','package-lock.json']) { const f=dir+'/'+name, p=JSON.parse(fs.readFileSync(f)); p.version=process.env.BUILD_VERSION; if (p.packages?.['']) p.packages[''].version=process.env.BUILD_VERSION; fs.writeFileSync(f, JSON.stringify(p, null, 2)+'\\n'); } }"
          printf "// Generated by GitHub assembly. Do not edit in source.\nexport const releaseVersion = '%s';\n" "$BUILD_VERSION" > backend-source/src/release-version.mjs
          (cd ui-source && BURROW_UI_SHA="${{ steps.revisions.outputs.ui }}" npm run build)
          printf 'version=%s\n' "$BUILD_VERSION" >> "$GITHUB_OUTPUT"
      - name: Materialize deployment payload
        run: |
          set -eu
          cd assembled
          rm -rf backend ui Dockerfile docker-entrypoint.sh compose.yml .dockerignore install.sh install-node-goblin.sh README.md burrow-logo.png SOURCE_VERSIONS
          mkdir backend ui
          for path in bin global-skills public scripts src; do cp -a "../backend-source/$path" "backend/$path"; done
          cp -a ../backend-source/package.json ../backend-source/package-lock.json backend/
          for path in src public dist scripts; do cp -a "../ui-source/$path" "ui/$path"; done
          cp -a ../ui-source/package.json ../ui-source/package-lock.json ../ui-source/index.html ../ui-source/tsconfig.json ../ui-source/vite.config.ts ../ui-source/vitest.config.ts ui/
          cp ../backend-source/deploy/installer/install.sh install.sh
          cp ../backend-source/deploy/installer/install-node-goblin.sh install-node-goblin.sh
          chmod 0755 install.sh install-node-goblin.sh
          cp ../backend-source/deploy/README.md README.md
          cp ../ui-source/public/burrow-logo.png burrow-logo.png
          cp ../backend-source/deploy/docker/Dockerfile Dockerfile
          cp ../backend-source/deploy/docker/docker-entrypoint.sh docker-entrypoint.sh
          cp ../backend-source/deploy/docker/compose.yml compose.yml
          cp ../backend-source/deploy/docker/.dockerignore .dockerignore
          printf '{"assembly":"%s","backend":"%s","ui":"%s","nodeGoblin":"%s"}\n' "${{ steps.build.outputs.version }}" "${{ steps.revisions.outputs.backend }}" "${{ steps.revisions.outputs.ui }}" "${{ steps.revisions.outputs.node_goblin }}" > backend/RELEASE_PROVENANCE.json
          printf 'Burrow-Build-Version %s\nBurrow-Backend %s\nBurrow-UI %s\nNode-Goblin %s\n' "${{ steps.build.outputs.version }}" "${{ steps.revisions.outputs.backend }}" "${{ steps.revisions.outputs.ui }}" "${{ steps.revisions.outputs.node_goblin }}" > SOURCE_VERSIONS
          (cd ui && npm ci && npm test)
          grep -R "${{ steps.revisions.outputs.ui }}" ui/dist/assets >/dev/null
      - name: Commit generated assembly
        id: publish
        run: |
          set -eu
          cd assembled
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: assemble Burrow"
            # Publishers are serialized and started from current main. Do not
            # rebase generated artifacts: a normal push safely rejects any
            # unexpected external branch advance without rewriting history.
            git push origin HEAD:main
          fi
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build public Node Goblin release assets
        id: node_goblin_assets
        run: |
          set -eu
          # The public Burrow repository owns the release tag namespace. Build
          # daemon assets here, but attach them only when the single canonical
          # Burrow release is created after the image has published.
          # Every canonical Burrow release carries a matching Node Goblin
          # installer. This also makes manual assemblies and Backend/UI-driven
          # releases installable; source-update payloads are not the authority
          # for public asset availability.
          version="${{ steps.build.outputs.version }}"
          printf '%s\n' "$version" > node-goblin-source/gateway/VERSION
          SOURCE_DATE_EPOCH=$(git -C node-goblin-source show -s --format=%ct HEAD) \
            node-goblin-source/gateway/deploy/build-release.sh node-goblin-source/gateway/dist
          printf 'present=true\n' >> "$GITHUB_OUTPUT"
          printf 'tarball=%s\nchecksum=%s\n' \
            "$GITHUB_WORKSPACE/node-goblin-source/gateway/dist/node-goblin-$version.tar.gz" \
            "$GITHUB_WORKSPACE/node-goblin-source/gateway/dist/node-goblin-$version.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: assembled
          push: true
          tags: |
            ghcr.io/nightshaman/burrow:latest
            ghcr.io/nightshaman/burrow:${{ steps.build.outputs.version }}
            ghcr.io/nightshaman/burrow:sha-${{ steps.publish.outputs.commit }}
      - name: Publish calendar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -eu
          tag="v$VERSION"
          git -C assembled tag "$tag" "$COMMIT"
          git -C assembled push origin "$tag"
          assets=''
          if [ "${{ steps.node_goblin_assets.outputs.present }}" = true ]; then
            assets="${{ steps.node_goblin_assets.outputs.tarball }} ${{ steps.node_goblin_assets.outputs.checksum }}"
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Burrow $VERSION" \
            --notes "Calendar-versioned Burrow release $VERSION assembled at $COMMIT. Image: ghcr.io/nightshaman/burrow:$VERSION" \
            $assets
