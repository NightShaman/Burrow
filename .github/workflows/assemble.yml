name: Assemble Burrow

on:
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Burrow-Backend commit SHA (defaults to its main branch)
        required: false
      ui_sha:
        description: Burrow-UI commit SHA (defaults to its main branch)
        required: false

permissions:
  contents: write
  packages: write

# Assembly publishes generated files back to main. Serialize publishers so two
# source-update dispatches cannot both build from stale main and race the push.
concurrency:
  group: burrow-assembly-main
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Read current pins only after this serialized job starts.
          ref: main
          path: assembled
      - name: Resolve source revisions
        id: revisions
        env:
          EVENT_SOURCE: ${{ github.event.client_payload.source_repository }}
          EVENT_SHA: ${{ github.event.client_payload.source_sha }}
          EVENT_REF: ${{ github.event.client_payload.source_ref }}
          INPUT_BACKEND_SHA: ${{ inputs.backend_sha }}
          INPUT_UI_SHA: ${{ inputs.ui_sha }}
          GH_TOKEN: ${{ secrets.BURROW_SOURCE_TOKEN }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "$EVENT_REF" != "main" ]; then
            echo 'Automatic assembly requires source_ref=main' >&2
            exit 1
          fi
          backend_ref="$INPUT_BACKEND_SHA"
          ui_ref="$INPUT_UI_SHA"
          if [ "$EVENT_SOURCE" = "NightShaman/Burrow-Backend" ] && [ -n "$EVENT_SHA" ]; then backend_ref="$EVENT_SHA"; fi
          if [ "$EVENT_SOURCE" = "NightShaman/Burrow-UI" ] && [ -n "$EVENT_SHA" ]; then ui_ref="$EVENT_SHA"; fi
          if [ -z "$backend_ref" ]; then backend_ref=main; fi
          if [ -z "$ui_ref" ]; then ui_ref=main; fi
          # Resolve even explicitly supplied refs before comparing, gating or checkout.
          backend_ref=$(gh api "repos/NightShaman/Burrow-Backend/commits/$backend_ref" --jq .sha)
          ui_ref=$(gh api "repos/NightShaman/Burrow-UI/commits/$ui_ref" --jq .sha)
          # A queued older dispatch must never roll a recorded component backward.
          for item in "backend NightShaman/Burrow-Backend $backend_ref" "ui NightShaman/Burrow-UI $ui_ref"; do
            set -- $item; recorded=$(awk -v key="Burrow-${1^}" '$1==key {print $2}' assembled/SOURCE_VERSIONS 2>/dev/null || true)
            if [ -n "$recorded" ] && [ "$recorded" != "$3" ]; then
              status=$(gh api "repos/$2/compare/$recorded...$3" --jq .status)
              [ "$status" = ahead ] || { echo "Refusing non-forward $1 pin: $recorded -> $3 ($status)" >&2; exit 1; }
            fi
          done
          printf 'backend=%s\nui=%s\n' "$backend_ref" "$ui_ref" >> "$GITHUB_OUTPUT"
      - name: Require trusted component CI for exact resolved SHAs
        env:
          GH_TOKEN: ${{ secrets.BURROW_SOURCE_TOKEN }}
          COMPONENT_CI_TIMEOUT_MS: ${{ vars.COMPONENT_CI_TIMEOUT_MS || '3600000' }}
        run: |
          node --test assembled/scripts/assembly/component-gate.test.mjs
          node assembled/scripts/assembly/component-gate.mjs NightShaman/Burrow-Backend "${{ steps.revisions.outputs.backend }}"
          node assembled/scripts/assembly/component-gate.mjs NightShaman/Burrow-UI "${{ steps.revisions.outputs.ui }}"
      - uses: actions/checkout@v4
        with:
          repository: NightShaman/Burrow-Backend
          ref: ${{ steps.revisions.outputs.backend }}
          token: ${{ secrets.BURROW_SOURCE_TOKEN }}
          path: backend-source
      - uses: actions/checkout@v4
        with:
          repository: NightShaman/Burrow-UI
          ref: ${{ steps.revisions.outputs.ui }}
          token: ${{ secrets.BURROW_SOURCE_TOKEN }}
          path: ui-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend-source/package-lock.json
            ui-source/package-lock.json
      - name: Install build dependencies and test assembly contracts
        run: |
          node --test assembled/scripts/assembly/*.test.mjs
          (cd ui-source && npm ci --no-audit --no-fund)
      - name: Stamp and build generated development assembly
        id: build
        run: |
          set -eu
          # Development assemblies have their own UTC calendar revision. This
          # identity is independent of public release tags and lets NightShaman
          # installs distinguish multiple builds produced on the same day.
          BUILD_DATE=$(date -u +%Y.%m.%d)
          CURRENT_VERSION=$(awk '$1=="Burrow-Build-Version" {print $2}' assembled/SOURCE_VERSIONS 2>/dev/null || true)
          BUILD_VERSION=$(node assembled/scripts/assembly/development-version.mjs "$BUILD_DATE" "$CURRENT_VERSION")
          BUILD_VERSION="$BUILD_VERSION" node -e "const fs=require('fs'); for (const dir of ['backend-source','ui-source']) { for (const name of ['package.json','package-lock.json']) { const f=dir+'/'+name, p=JSON.parse(fs.readFileSync(f)); p.version=process.env.BUILD_VERSION; if (p.packages?.['']) p.packages[''].version=process.env.BUILD_VERSION; fs.writeFileSync(f, JSON.stringify(p, null, 2)+'\\n'); } }"
          printf "// Generated by GitHub assembly. Do not edit in source.\nexport const releaseVersion = '%s';\n" "$BUILD_VERSION" > backend-source/src/release-version.mjs
          (cd ui-source && BURROW_UI_SHA="${{ steps.revisions.outputs.ui }}" npm run build)
          printf 'version=%s\n' "$BUILD_VERSION" >> "$GITHUB_OUTPUT"
      - name: Materialize deployment payload
        run: |
          set -eu
          cd assembled
          # Replace only assembled runtime and release payload. Repository-owned
          # presentation and governance files (README.md, docs/, LICENSE,
          # .github/, and their assets) must survive every assembly unchanged.
          rm -rf backend ui Dockerfile docker-entrypoint.sh compose.yml .dockerignore install.sh install-node-goblin.sh SOURCE_VERSIONS
          mkdir backend ui
          for path in bin global-skills public scripts src; do cp -a "../backend-source/$path" "backend/$path"; done
          cp -a ../backend-source/package.json ../backend-source/package-lock.json backend/
          # The running /api/openapi.json route reads this contract from its
          # backend root. Do not ship the canonical source's entire docs tree.
          install -d backend/docs
          cp ../backend-source/docs/openapi.json backend/docs/openapi.json
          for path in src public dist scripts; do cp -a "../ui-source/$path" "ui/$path"; done
          cp -a ../ui-source/package.json ../ui-source/package-lock.json ../ui-source/index.html ../ui-source/tsconfig.json ../ui-source/vite.config.ts ../ui-source/vitest.config.ts ui/
          cp ../backend-source/deploy/installer/install.sh install.sh
          chmod 0755 install.sh
          cp ../backend-source/deploy/docker/Dockerfile Dockerfile
          cp ../backend-source/deploy/docker/docker-entrypoint.sh docker-entrypoint.sh
          cp ../backend-source/deploy/docker/compose.yml compose.yml
          cp ../backend-source/deploy/docker/.dockerignore .dockerignore
          printf '{"assembly":"%s","backend":"%s","ui":"%s"}\n' "${{ steps.build.outputs.version }}" "${{ steps.revisions.outputs.backend }}" "${{ steps.revisions.outputs.ui }}" > backend/RELEASE_PROVENANCE.json
          printf 'Burrow-Build-Version %s\nBurrow-Backend %s\nBurrow-UI %s\n' "${{ steps.build.outputs.version }}" "${{ steps.revisions.outputs.backend }}" "${{ steps.revisions.outputs.ui }}" > SOURCE_VERSIONS
          grep -R "${{ steps.revisions.outputs.ui }}" ui/dist/assets >/dev/null
      - name: Verify assembled payload shape
        run: |
          set -eu
          node --test assembled/scripts/assembly/*.test.mjs
          test -f assembled/backend/RELEASE_PROVENANCE.json
          test -f assembled/ui/dist/index.html
          grep -R "${{ steps.revisions.outputs.ui }}" assembled/ui/dist/assets >/dev/null
      - name: Build development image
        uses: docker/build-push-action@v6
        with:
          context: assembled
          load: true
          push: false
          build-args: |
            BURROW_UI_SHA=${{ steps.revisions.outputs.ui }}
          tags: burrow-development:tested
      - name: Smoke development image
        run: node assembled/scripts/assembly/packaged-smoke.mjs burrow-development:tested assembled
      - name: Commit generated assembly
        id: publish
        run: |
          set -eu
          cd assembled
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: assemble Burrow"
            # Publishers are serialized and started from current main. Do not
            # rebase generated artifacts: a normal push safely rejects any
            # unexpected external branch advance without rewriting history.
            git push origin HEAD:main
          fi
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested development image
        run: |
          set -eu
          for tag in latest dev "sha-${{ steps.publish.outputs.commit }}"; do
            docker tag burrow-development:tested "ghcr.io/nightshaman/burrow:$tag"
            docker push "ghcr.io/nightshaman/burrow:$tag"
          done
