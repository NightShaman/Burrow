name: Promote public releases

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-promotion
  cancel-in-progress: false

env:
  PUBLIC_OWNER: GoblinKing-Burrow

jobs:
  stage:
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.plan.outputs.publishable }}
      release_date: ${{ steps.plan.outputs.release_date }}
      ui_sha: ${{ steps.plan.outputs.ui_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: orchestrator
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Freeze source revisions
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
        run: |
          set -eu
          burrow=$(gh api repos/NightShaman/Burrow/commits/main --jq .sha)
          backend=$(awk '$1=="Burrow-Backend" {print $2}' orchestrator/SOURCE_VERSIONS)
          ui=$(awk '$1=="Burrow-UI" {print $2}' orchestrator/SOURCE_VERSIONS)
          node_goblin=$(gh api repos/NightShaman/Node-Goblin/commits/main --jq .sha)
          gss=$(gh api repos/NightShaman/Goblin-Secret-Store/commits/main --jq .sha)
          skills=$(gh api repos/NightShaman/Burrow-Skills/commits/main --jq .sha)
          for item in \
            "burrow $burrow NightShaman/Burrow" \
            "burrowBackend $backend NightShaman/Burrow-Backend" \
            "burrowUi $ui NightShaman/Burrow-UI" \
            "nodeGoblin $node_goblin NightShaman/Node-Goblin" \
            "goblinSecretStore $gss NightShaman/Goblin-Secret-Store" \
            "burrowSkills $skills NightShaman/Burrow-Skills"; do
            set -- $item
            resolved=$(gh api "repos/$3/commits/$2" --jq .sha)
            [ "$resolved" = "$2" ] || { echo "source resolution changed for $1" >&2; exit 1; }
          done
          printf '{"burrow":"%s","burrowBackend":"%s","burrowUi":"%s","nodeGoblin":"%s","goblinSecretStore":"%s","burrowSkills":"%s"}\n' \
            "$burrow" "$backend" "$ui" "$node_goblin" "$gss" "$skills" > sources.json
      - name: Read last public manifest
        run: |
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/$PUBLIC_OWNER/Burrow/main/PUBLIC_RELEASE.json" \
            --output previous.json || printf 'null\n' > previous.json
      - name: Build immutable promotion plan
        id: plan
        run: |
          node orchestrator/scripts/promotion/plan.mjs orchestrator/scripts/promotion/targets.json sources.json previous.json > plan.json
          cat plan.json
          printf 'publishable=%s\n' "$(node -p "require('./plan.json').publishable")" >> "$GITHUB_OUTPUT"
          printf 'release_date=%s\n' "$(node -p "require('./plan.json').releaseDate")" >> "$GITHUB_OUTPUT"
          printf 'ui_sha=%s\n' "$(node -p "require('./sources.json').burrowUi")" >> "$GITHUB_OUTPUT"
      - name: Expose frozen SHAs for checkouts
        if: steps.plan.outputs.publishable == 'true'
        id: frozen
        run: |
          for key in burrow nodeGoblin goblinSecretStore burrowSkills; do
            printf '%s=%s\n' "$key" "$(node -p "require('./sources.json').$key")" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v4
        if: steps.plan.outputs.publishable == 'true'
        with:
          repository: NightShaman/Burrow
          ref: ${{ steps.frozen.outputs.burrow }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: source-burrow
      - uses: actions/checkout@v4
        if: steps.plan.outputs.publishable == 'true'
        with:
          repository: NightShaman/Node-Goblin
          ref: ${{ steps.frozen.outputs.nodeGoblin }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: source-node-goblin
      - uses: actions/checkout@v4
        if: steps.plan.outputs.publishable == 'true'
        with:
          repository: NightShaman/Goblin-Secret-Store
          ref: ${{ steps.frozen.outputs.goblinSecretStore }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: source-gss
      - uses: actions/checkout@v4
        if: steps.plan.outputs.publishable == 'true'
        with:
          repository: NightShaman/Burrow-Skills
          ref: ${{ steps.frozen.outputs.burrowSkills }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: source-skills
      - name: Stage allowlisted public trees
        if: steps.plan.outputs.publishable == 'true'
        env:
          RELEASE_DATE: ${{ steps.plan.outputs.release_date }}
        run: |
          cat > roots.json <<JSON
          {"burrow":"$GITHUB_WORKSPACE/source-burrow","nodeGoblin":"$GITHUB_WORKSPACE/source-node-goblin","goblinSecretStore":"$GITHUB_WORKSPACE/source-gss","burrowSkills":"$GITHUB_WORKSPACE/source-skills"}
          JSON
          node orchestrator/scripts/promotion/stage-snapshots.mjs roots.json staged "$RELEASE_DATE" sources.json
      - name: Verify staged trees
        if: steps.plan.outputs.publishable == 'true'
        run: |
          node --test orchestrator/scripts/promotion/*.test.mjs
          node orchestrator/scripts/promotion/validate-public-readiness.mjs staged
          (cd staged/Goblin-Secret-Store && npm run build && node --test $(find server ui -name '*.test.mjs' ! -name 'core-integration.test.mjs' -print))
          (cd staged/Node-Goblin/gateway && npm test)
          sh -n staged/Burrow/install.sh staged/Burrow/install-node-goblin.sh
          docker build --build-arg BURROW_UI_SHA="$(node -p "require('./sources.json').burrowUi")" -t burrow-public-candidate staged/Burrow
          node staged/Burrow/scripts/assembly/packaged-smoke.mjs burrow-public-candidate staged/Burrow
          for target in burrow nodeGoblin goblinSecretStore burrowSkills; do
            test ! -d "staged/$target/.git"
            ! find "staged/$target" -type f \( -name '*.env' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          done
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.publishable == 'true'
        with:
          name: public-promotion-${{ steps.plan.outputs.release_date }}
          path: |
            staged
            sources.json
            plan.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: stage
    if: needs.stage.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    environment: public-promotion
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: orchestrator
      - uses: actions/download-artifact@v4
        with:
          name: public-promotion-${{ needs.stage.outputs.release_date }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish immutable Git snapshots
        env:
          PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
          VERSION: ${{ needs.stage.outputs.release_date }}
        run: |
          set -eu
          orchestrator/scripts/promotion/publish-snapshot.sh Node-Goblin staged/Node-Goblin "$VERSION" "Release Node Goblin $VERSION"
          orchestrator/scripts/promotion/publish-snapshot.sh Goblin-Secret-Store staged/Goblin-Secret-Store "$VERSION" "Release Goblin Secret Store $VERSION"
          orchestrator/scripts/promotion/publish-snapshot.sh Burrow-Skills staged/Burrow-Skills "$VERSION" "Release Burrow Skills $VERSION"
      - name: Build Node Goblin release assets
        env:
          VERSION: ${{ needs.stage.outputs.release_date }}
        run: |
          SOURCE_DATE_EPOCH=0 staged/Node-Goblin/gateway/deploy/build-release.sh staged/Node-Goblin/gateway/dist
      - name: Publish releases
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
          VERSION: ${{ needs.stage.outputs.release_date }}
        run: |
          set -eu
          create_release() {
            repo=$1; shift
            if gh release view "v$VERSION" --repo "$PUBLIC_OWNER/$repo" >/dev/null 2>&1; then return; fi
            gh release create "v$VERSION" --repo "$PUBLIC_OWNER/$repo" --title "$repo $VERSION" --notes "Public calendar release $VERSION." "$@"
          }
          create_release Node-Goblin \
            "staged/Node-Goblin/gateway/dist/node-goblin-$VERSION.tar.gz" \
            "staged/Node-Goblin/gateway/dist/node-goblin-$VERSION.tar.gz.sha256"
          create_release Goblin-Secret-Store
          create_release Burrow-Skills
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: GoblinKing-Burrow
          password: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
      - name: Publish Burrow container image
        uses: docker/build-push-action@v6
        with:
          context: staged/Burrow
          push: true
          build-args: |
            BURROW_UI_SHA=${{ needs.stage.outputs.ui_sha }}
          tags: |
            ghcr.io/goblinking-burrow/burrow:latest
            ghcr.io/goblinking-burrow/burrow:${{ needs.stage.outputs.release_date }}
      - name: Publish Burrow snapshot and release manifest last
        env:
          PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
          GH_TOKEN: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
          VERSION: ${{ needs.stage.outputs.release_date }}
        run: |
          set -eu
          orchestrator/scripts/promotion/publish-snapshot.sh Burrow staged/Burrow "$VERSION" "Release Burrow $VERSION"
          if ! gh release view "v$VERSION" --repo "$PUBLIC_OWNER/Burrow" >/dev/null 2>&1; then
            gh release create "v$VERSION" --repo "$PUBLIC_OWNER/Burrow" --title "Burrow $VERSION" --notes "Public calendar release $VERSION. Image: ghcr.io/goblinking-burrow/burrow:$VERSION"
          fi
