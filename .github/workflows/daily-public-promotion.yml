name: Validate and promote public releases

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run complete frozen-source validation without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: public-promotion
  cancel-in-progress: false

env:
  PUBLIC_OWNER: GoblinKing-Burrow

jobs:
  stage:
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.plan.outputs.publishable }}
      validation_required: ${{ steps.plan.outputs.validation_required }}
      release_date: ${{ steps.plan.outputs.release_date }}
      artifact_run_id: ${{ steps.plan.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: orchestrator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Discover pending publication across every Public snapshot
        run: node orchestrator/scripts/promotion/discover-publication.mjs orchestrator/scripts/promotion/targets.json previous.json
      - name: Freeze source revisions
        if: env.PROMOTION_TERMINAL_COMPLETE != 'false'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
        run: |
          set -eu
          burrow=$(git -C orchestrator rev-parse HEAD)
          backend=$(awk '$1=="Burrow-Backend" {print $2}' orchestrator/SOURCE_VERSIONS)
          ui=$(awk '$1=="Burrow-UI" {print $2}' orchestrator/SOURCE_VERSIONS)
          node_goblin=$(gh api repos/NightShaman/Node-Goblin/commits/main --jq .sha)
          gss=$(gh api repos/NightShaman/Goblin-Secret-Store/commits/main --jq .sha)
          skills=$(gh api repos/NightShaman/Burrow-Skills/commits/main --jq .sha)
          backdoor=$(gh api repos/NightShaman/Burrow-Backdoor/commits/main --jq .sha)
          tutor=$(gh api repos/NightShaman/Burrow-Tutor/commits/main --jq .sha)
          theater=$(gh api repos/NightShaman/Burrow-Theater/commits/main --jq .sha)
          switchboard=$(gh api repos/NightShaman/Burrow-Switchboard/commits/main --jq .sha)
          auditor=$(gh api repos/NightShaman/Burrow-Auditor/commits/main --jq .sha)
          plug=$(gh api repos/NightShaman/Burrow-Plug/commits/main --jq .sha)
          for item in \
            "burrow $burrow NightShaman/Burrow" \
            "burrowBackend $backend NightShaman/Burrow-Backend" \
            "burrowUi $ui NightShaman/Burrow-UI" \
            "nodeGoblin $node_goblin NightShaman/Node-Goblin" \
            "goblinSecretStore $gss NightShaman/Goblin-Secret-Store" \
            "burrowSkills $skills NightShaman/Burrow-Skills" \
            "burrowBackdoor $backdoor NightShaman/Burrow-Backdoor" \
            "burrowTutor $tutor NightShaman/Burrow-Tutor" \
            "burrowTheater $theater NightShaman/Burrow-Theater" \
            "burrowSwitchboard $switchboard NightShaman/Burrow-Switchboard" \
            "burrowAuditor $auditor NightShaman/Burrow-Auditor" \
            "burrowPlug $plug NightShaman/Burrow-Plug"; do
            set -- $item
            resolved=$(gh api "repos/$3/commits/$2" --jq .sha)
            [ "$resolved" = "$2" ] || { echo "source resolution changed for $1" >&2; exit 1; }
          done
          printf '{"burrow":"%s","burrowBackend":"%s","burrowUi":"%s","nodeGoblin":"%s","goblinSecretStore":"%s","burrowSkills":"%s","burrowBackdoor":"%s","burrowTutor":"%s","burrowTheater":"%s","burrowSwitchboard":"%s","burrowAuditor":"%s","burrowPlug":"%s"}\n' \
            "$burrow" "$backend" "$ui" "$node_goblin" "$gss" "$skills" "$backdoor" "$tutor" "$theater" "$switchboard" "$auditor" "$plug" > sources.json
      - name: Build immutable promotion plan
        id: plan
        run: |
          set -eu
          if [ "$PROMOTION_TERMINAL_COMPLETE" = false ]; then
            node -p "JSON.stringify(require('./previous.json').sources)" > sources.json
          fi
          node orchestrator/scripts/promotion/plan.mjs orchestrator/scripts/promotion/targets.json sources.json previous.json > plan.json
          cat plan.json
          resume_run=$(node -p "require('./plan.json').resumeRunId || ''")
          if [ -n "$resume_run" ] && [ "${{ inputs.validate_only }}" = true ]; then
            echo 'Pending publication must be resumed before validate-only can freeze newer sources' >&2
            exit 1
          fi
          printf 'artifact_run_id=%s\n' "${resume_run:-${{ github.run_id }}}" >> "$GITHUB_OUTPUT"
          publishable=$(node -p "require('./plan.json').publishable")
          validation_required="$publishable"
          printf 'resume=%s\n' "$(node -p "Boolean(require('./plan.json').resumeRunId)")" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.validate_only }}" = "true" ]; then validation_required=true; publishable=false; fi
          printf 'publishable=%s\n' "$publishable" >> "$GITHUB_OUTPUT"
          printf 'validation_required=%s\n' "$validation_required" >> "$GITHUB_OUTPUT"
          printf 'release_date=%s\n' "$(node -p "require('./plan.json').releaseDate")" >> "$GITHUB_OUTPUT"
      - name: Expose frozen SHAs for checkouts
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        id: frozen
        run: |
          for key in burrow burrowBackend burrowUi nodeGoblin goblinSecretStore burrowSkills burrowBackdoor burrowTutor burrowTheater burrowSwitchboard burrowAuditor burrowPlug; do
            printf '%s=%s\n' "$key" "$(node -p "require('./plan.json').sources.$key")" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Burrow
          ref: ${{ steps.frozen.outputs.burrow }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: sources/Burrow
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Burrow-Backend
          ref: ${{ steps.frozen.outputs.burrowBackend }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: sources/Burrow-Backend
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Burrow-UI
          ref: ${{ steps.frozen.outputs.burrowUi }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: sources/Burrow-UI
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Node-Goblin
          ref: ${{ steps.frozen.outputs.nodeGoblin }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: sources/Node-Goblin
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Goblin-Secret-Store
          ref: ${{ steps.frozen.outputs.goblinSecretStore }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: sources/Goblin-Secret-Store
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Burrow-Skills
          ref: ${{ steps.frozen.outputs.burrowSkills }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: sources/Burrow-Skills
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Burrow-Backdoor
          ref: ${{ steps.frozen.outputs.burrowBackdoor }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: sources/Burrow-Backdoor
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Burrow-Tutor
          ref: ${{ steps.frozen.outputs.burrowTutor }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: sources/Burrow-Tutor
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Burrow-Theater
          ref: ${{ steps.frozen.outputs.burrowTheater }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: sources/Burrow-Theater
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Burrow-Switchboard
          ref: ${{ steps.frozen.outputs.burrowSwitchboard }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          path: sources/Burrow-Switchboard
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Burrow-Auditor
          ref: ${{ steps.frozen.outputs.burrowAuditor }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          persist-credentials: false
          path: sources/Burrow-Auditor
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          repository: NightShaman/Burrow-Plug
          ref: ${{ steps.frozen.outputs.burrowPlug }}
          token: ${{ secrets.PUBLIC_PROMOTION_SOURCE_TOKEN }}
          persist-credentials: false
          path: sources/Burrow-Plug
          fetch-depth: 0
      - name: Install PostgreSQL 17 and pgvector for critical release validation
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/postgresql.asc >/dev/null
          . /etc/os-release
          echo "deb https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-client-17 postgresql-17-pgvector
      - name: Run critical frozen-source test suites
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        env:
          BURROW_TEST_TIMEOUT_MS: '600000'
          BURROW_TEST_DISPOSABLE_POSTGRES: '1'
        timeout-minutes: 35
        run: |
          set -eu
          (cd sources/Burrow-Backend && npm ci --no-audit --no-fund)
          node orchestrator/scripts/promotion/run-critical-backend.mjs sources/Burrow-Backend
          (cd sources/Burrow-UI && npm ci --no-audit --no-fund && npm test && npm run build)
          (cd sources/Node-Goblin/gateway && npm test)
          (cd sources/Goblin-Secret-Store && npm run build && BURROW_CORE_ROOT="$GITHUB_WORKSPACE/sources/Burrow-Backend" BURROW_POSTGRES_BIN_DIR=/usr/lib/postgresql/17/bin npm test)
          (cd sources/Burrow-Backdoor && npm ci --ignore-scripts --no-audit --no-fund && BURROW_CORE_ROOT="$GITHUB_WORKSPACE/sources/Burrow-Backend" npm run check)
          (cd sources/Burrow-Tutor && BURROW_CORE_ROOT="$GITHUB_WORKSPACE/sources/Burrow-Backend" npm run build && BURROW_CORE_ROOT="$GITHUB_WORKSPACE/sources/Burrow-Backend" timeout --kill-after=15s 10m npm test)
          (cd sources/Burrow-Theater && BURROW_CORE_ROOT="$GITHUB_WORKSPACE/sources/Burrow-Backend" npm run build && BURROW_CORE_ROOT="$GITHUB_WORKSPACE/sources/Burrow-Backend" timeout --kill-after=15s 10m npm test)
          (cd sources/Burrow-Switchboard && npm run build && node --test test/server.test.mjs test/discord.test.mjs test/room-history.test.mjs test/ui.test.mjs && BURROW_CORE_ROOT="$GITHUB_WORKSPACE/sources/Burrow-Backend" npm run test:core)
      - name: Validate frozen Auditor and Plug-ins against pinned Core
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        timeout-minutes: 25
        env:
          BURROW_CORE_ROOT: ${{ github.workspace }}/sources/Burrow-Backend
          PG_BINDIR: /usr/lib/postgresql/17/bin
          PLAYWRIGHT_MODULE: ''
          UI_EVIDENCE: ''
        run: |
          set -eu
          test -s sources/Burrow-Skills/burrow-auditor/SKILL.md
          (
            cd sources/Burrow-Auditor
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build
            npm test
            timeout --kill-after=15s 10m npm run test:core
          )
          (
            cd sources/Burrow-Plug
            # Plug-ins bundles its validator and currently has no dependencies or lockfile.
            if [ -f package-lock.json ]; then
              npm ci --ignore-scripts --no-audit --no-fund
            else
              node -e 'const p=require("./package.json"); if ([p.dependencies, p.devDependencies, p.optionalDependencies, p.peerDependencies].some(d => Object.keys(d || {}).length)) throw Error("Plug-ins dependency lockfile required")'
            fi
            npm run build
            npm test
            timeout --kill-after=15s 10m npm run test:core
          )
      - name: Stage allowlisted public trees and release notes
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        env:
          RELEASE_DATE: ${{ steps.plan.outputs.release_date }}
        run: |
          cat > roots.json <<JSON
          {"burrow":"$GITHUB_WORKSPACE/sources/Burrow","nodeGoblin":"$GITHUB_WORKSPACE/sources/Node-Goblin","goblinSecretStore":"$GITHUB_WORKSPACE/sources/Goblin-Secret-Store","burrowSkills":"$GITHUB_WORKSPACE/sources/Burrow-Skills","burrowBackdoor":"$GITHUB_WORKSPACE/sources/Burrow-Backdoor","burrowTutor":"$GITHUB_WORKSPACE/sources/Burrow-Tutor","burrowTheater":"$GITHUB_WORKSPACE/sources/Burrow-Theater","burrowSwitchboard":"$GITHUB_WORKSPACE/sources/Burrow-Switchboard","burrowAuditor":"$GITHUB_WORKSPACE/sources/Burrow-Auditor","burrowPlug":"$GITHUB_WORKSPACE/sources/Burrow-Plug"}
          JSON
          cat > note-roots.json <<JSON
          {"burrow":"$GITHUB_WORKSPACE/sources/Burrow","burrowBackend":"$GITHUB_WORKSPACE/sources/Burrow-Backend","burrowUi":"$GITHUB_WORKSPACE/sources/Burrow-UI","nodeGoblin":"$GITHUB_WORKSPACE/sources/Node-Goblin","goblinSecretStore":"$GITHUB_WORKSPACE/sources/Goblin-Secret-Store","burrowSkills":"$GITHUB_WORKSPACE/sources/Burrow-Skills","burrowBackdoor":"$GITHUB_WORKSPACE/sources/Burrow-Backdoor","burrowTutor":"$GITHUB_WORKSPACE/sources/Burrow-Tutor","burrowTheater":"$GITHUB_WORKSPACE/sources/Burrow-Theater","burrowSwitchboard":"$GITHUB_WORKSPACE/sources/Burrow-Switchboard","burrowAuditor":"$GITHUB_WORKSPACE/sources/Burrow-Auditor","burrowPlug":"$GITHUB_WORKSPACE/sources/Burrow-Plug"}
          JSON
          node orchestrator/scripts/promotion/stage-snapshots.mjs roots.json staged "$RELEASE_DATE" sources.json
          mkdir -p release-notes
          for target in burrow nodeGoblin goblinSecretStore burrowSkills burrowBackdoor burrowTutor burrowTheater burrowSwitchboard burrowAuditor burrowPlug; do
            node orchestrator/scripts/promotion/release-notes.mjs "$target" "$RELEASE_DATE" sources.json previous.json note-roots.json "release-notes/$target.md"
            cat "release-notes/$target.md"
          done
      - name: Verify staged release trees
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        run: |
          set -eu
          node --test orchestrator/scripts/promotion/*.test.mjs
          node orchestrator/scripts/promotion/validate-public-readiness.mjs staged sources/Burrow-Backend
          (cd staged/Burrow && node --test scripts/install/*.test.mjs)
          sh -n staged/Burrow/install.sh staged/Node-Goblin/install.sh
          node -e "for (const name of ['Burrow-Backdoor', 'Burrow-Tutor', 'Burrow-Theater', 'Burrow-Switchboard']) { const root='staged/'+name; const version=require('./'+root+'/package.json').version; if (version !== process.env.VERSION || require('./'+root+'/burrow.mod.json').version !== version) throw Error(name+' version mismatch'); }"
        env:
          VERSION: ${{ steps.plan.outputs.release_date }}
      - name: Build and smoke the public Burrow image
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        run: |
          set -euo pipefail
          docker build --build-arg BURROW_UI_SHA="$(node -p "require('./sources.json').burrowUi")" \
            --label org.opencontainers.image.source=https://github.com/GoblinKing-Burrow/Burrow \
            --label org.opencontainers.image.url=https://github.com/GoblinKing-Burrow/Burrow \
            --label org.opencontainers.image.version="${{ steps.plan.outputs.release_date }}" \
            -t burrow-public-candidate staged/Burrow
          node staged/Burrow/scripts/assembly/packaged-smoke.mjs burrow-public-candidate staged/Burrow
          # Persist the exact image just smoked, including its immutable local ID.
          image_id=$(docker image inspect --format '{{.Id}}' burrow-public-candidate)
          test "${#image_id}" -eq 71
          printf '{"schemaVersion":1,"imageId":"%s"}\n' "$image_id" > tested-image.json
          docker save burrow-public-candidate | gzip -1 > tested-image.tar.gz
          sha256sum tested-image.tar.gz > tested-image.tar.gz.sha256
          test -s tested-image.tar.gz
          for target in Burrow Node-Goblin Goblin-Secret-Store Burrow-Skills Burrow-Backdoor Burrow-Tutor Burrow-Theater Burrow-Switchboard Burrow-Auditor Burrow-Plug; do
            test ! -d "staged/$target/.git"
            ! find "staged/$target" -type f \( -name '*.env' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          done
      - name: Build and verify Node Goblin release asset from the frozen staged source
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.release_date }}
        run: |
          set -eu
          mkdir -p release-assets/nodeGoblin
          SOURCE_DATE_EPOCH=0 sh staged/Node-Goblin/gateway/deploy/build-release.sh release-assets/nodeGoblin
          node orchestrator/scripts/promotion/verify-node-goblin-asset.mjs staged release-assets/nodeGoblin "$VERSION"
      - name: Bundle validated snapshots with executable permissions
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        run: |
          set -eu
          test -x staged/Burrow/install.sh
          test -x staged/Node-Goblin/install.sh
          node orchestrator/scripts/promotion/executable-modes.mjs record staged executable-modes.json
          # Uploading loose files strips modes (and can omit hidden files).
          # Tar preserves the entire already-allowlisted tree across that boundary.
          tar -cpf public-promotion.tar staged sources.json plan.json release-notes release-assets executable-modes.json tested-image.json tested-image.tar.gz tested-image.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.validation_required == 'true' && steps.plan.outputs.resume != 'true'
        with:
          name: public-promotion-${{ steps.plan.outputs.release_date }}
          path: public-promotion.tar
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: stage
    if: needs.stage.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    environment: public-promotion
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: orchestrator
      - uses: actions/download-artifact@v4
        with:
          name: public-promotion-${{ needs.stage.outputs.release_date }}
          run-id: ${{ needs.stage.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore snapshots and verify executable permissions before publishing
        id: restore
        env:
          EXPECTED_DATE: ${{ needs.stage.outputs.release_date }}
          EXPECTED_RUN: ${{ needs.stage.outputs.artifact_run_id }}
          PROMOTION_PUBLISHABLE: ${{ needs.stage.outputs.publishable }}
          PROMOTION_VALIDATE_ONLY: ${{ inputs.validate_only == true }}
        run: |
          set -eu
          tar -xpf public-promotion.tar
          node -e "const m=require('./staged/Burrow/PUBLIC_RELEASE.json'), p=require('./plan.json'); if(m.releaseDate !== process.env.EXPECTED_DATE || String(m.promotionRunId) !== process.env.EXPECTED_RUN || p.releaseDate !== m.releaseDate || !require('node:util').isDeepStrictEqual(p.sources, m.sources)) throw Error('promotion_artifact_identity_mismatch')"
          node orchestrator/scripts/promotion/executable-modes.mjs verify staged executable-modes.json
          test -x staged/Burrow/install.sh
          test -x staged/Node-Goblin/install.sh
          node orchestrator/scripts/promotion/verify-node-goblin-asset.mjs staged release-assets/nodeGoblin "${{ needs.stage.outputs.release_date }}"
          sha256sum -c tested-image.tar.gz.sha256
          # Freeze caller intent before publication; never derive it from public main/latest.
          node orchestrator/scripts/promotion/verify-public-outcome.mjs prepare public-outcome-intent.json
      - name: Publish immutable Git snapshots
        env:
          PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
          VERSION: ${{ needs.stage.outputs.release_date }}
        run: |
          set -eu
          orchestrator/scripts/promotion/publish-snapshot.sh Node-Goblin staged/Node-Goblin "$VERSION" "Release Node Goblin $VERSION"
          orchestrator/scripts/promotion/publish-snapshot.sh Goblin-Secret-Store staged/Goblin-Secret-Store "$VERSION" "Release Goblin Secret Store $VERSION"
          orchestrator/scripts/promotion/publish-snapshot.sh Burrow-Skills staged/Burrow-Skills "$VERSION" "Release Burrow Skills $VERSION"
          orchestrator/scripts/promotion/publish-snapshot.sh Burrow-Backdoor staged/Burrow-Backdoor "$VERSION" "Release Burrow Backdoor $VERSION"
          orchestrator/scripts/promotion/publish-snapshot.sh Burrow-Tutor staged/Burrow-Tutor "$VERSION" "Release Burrow Tutor $VERSION"
          orchestrator/scripts/promotion/publish-snapshot.sh Burrow-Theater staged/Burrow-Theater "$VERSION" "Release Burrow Theater $VERSION"
          orchestrator/scripts/promotion/publish-snapshot.sh Burrow-Switchboard staged/Burrow-Switchboard "$VERSION" "Release Burrow Switchboard $VERSION"
          if [ "${{ steps.restore.outputs.publish_auditor_and_plug }}" = true ]; then
            orchestrator/scripts/promotion/publish-snapshot.sh Burrow-Auditor staged/Burrow-Auditor "$VERSION" "Release Burrow Auditor $VERSION"
            orchestrator/scripts/promotion/publish-snapshot.sh Burrow-Plug staged/Burrow-Plug "$VERSION" "Release Burrow Plug-ins $VERSION"
          fi
      - name: Publish component releases with coordinated notes
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
          VERSION: ${{ needs.stage.outputs.release_date }}
        run: |
          set -eu
          orchestrator/scripts/promotion/publish-release.sh "$PUBLIC_OWNER/Node-Goblin" "$VERSION" release-notes/nodeGoblin.md \
            "release-assets/nodeGoblin/node-goblin-$VERSION.tar.gz" \
            "release-assets/nodeGoblin/node-goblin-$VERSION.tar.gz.sha256"
          orchestrator/scripts/promotion/publish-release.sh "$PUBLIC_OWNER/Goblin-Secret-Store" "$VERSION" release-notes/goblinSecretStore.md
          orchestrator/scripts/promotion/publish-release.sh "$PUBLIC_OWNER/Burrow-Skills" "$VERSION" release-notes/burrowSkills.md
          orchestrator/scripts/promotion/publish-release.sh "$PUBLIC_OWNER/Burrow-Backdoor" "$VERSION" release-notes/burrowBackdoor.md
          orchestrator/scripts/promotion/publish-release.sh "$PUBLIC_OWNER/Burrow-Tutor" "$VERSION" release-notes/burrowTutor.md
          orchestrator/scripts/promotion/publish-release.sh "$PUBLIC_OWNER/Burrow-Theater" "$VERSION" release-notes/burrowTheater.md
          orchestrator/scripts/promotion/publish-release.sh "$PUBLIC_OWNER/Burrow-Switchboard" "$VERSION" release-notes/burrowSwitchboard.md
          if [ "${{ steps.restore.outputs.publish_auditor_and_plug }}" = true ]; then
            PUBLIC_RELEASE_TITLE="Burrow Auditor" orchestrator/scripts/promotion/publish-release.sh "$PUBLIC_OWNER/Burrow-Auditor" "$VERSION" release-notes/burrowAuditor.md
            PUBLIC_RELEASE_TITLE="Burrow Plug-ins" orchestrator/scripts/promotion/publish-release.sh "$PUBLIC_OWNER/Burrow-Plug" "$VERSION" release-notes/burrowPlug.md
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: GoblinKing-Burrow
          password: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
      - name: Publish exact smoke-tested Burrow image and verify public tag digests
        env:
          VERSION: ${{ needs.stage.outputs.release_date }}
        run: |
          set -euo pipefail
          sha256sum -c tested-image.tar.gz.sha256
          gzip -dc tested-image.tar.gz > tested-image.tar
          # docker load restores the validated image; never rebuild after smoke.
          # The only public image publication code checks the restored image ID,
          # tag IDs and remote per-tag manifest digests before release proceeds.
          node orchestrator/scripts/promotion/publish-tested-image.mjs "$VERSION" tested-image.json
      - name: Verify image repository association
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
        run: |
          set -eu
          linked_repository=$(gh api /user/packages/container/burrow --jq '.repository.full_name // ""')
          [ "$linked_repository" = "$PUBLIC_OWNER/Burrow" ] || {
            echo "GHCR package is not linked to $PUBLIC_OWNER/Burrow" >&2
            exit 1
          }
      - name: Verify anonymous image availability
        run: |
          set -eu
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "ghcr.io/goblinking-burrow/burrow:${{ needs.stage.outputs.release_date }}"
      - name: Publish Burrow snapshot and coordinated release last
        env:
          PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
          GH_TOKEN: ${{ secrets.PUBLIC_PROMOTION_DESTINATION_TOKEN }}
          VERSION: ${{ needs.stage.outputs.release_date }}
        run: |
          set -eu
          orchestrator/scripts/promotion/publish-snapshot.sh Burrow staged/Burrow "$VERSION" "Release Burrow $VERSION"
          orchestrator/scripts/promotion/publish-release.sh "$PUBLIC_OWNER/Burrow" "$VERSION" release-notes/burrow.md
      - name: Check exact public Burrow outcome once
        if: ${{ always() && needs.stage.outputs.publishable == 'true' && steps.restore.outcome == 'success' }}
        env:
          PROMOTION_PUBLISHABLE: ${{ needs.stage.outputs.publishable }}
          PROMOTION_VALIDATE_ONLY: ${{ inputs.validate_only == true }}
        run: node orchestrator/scripts/promotion/verify-public-outcome.mjs verify public-outcome-intent.json public-outcome.json
      - name: Check exact public Auditor outcome once
        if: ${{ always() && needs.stage.outputs.publishable == 'true' && steps.restore.outcome == 'success' && steps.restore.outputs.publish_auditor_and_plug == 'true' }}
        env:
          PROMOTION_PUBLISHABLE: ${{ needs.stage.outputs.publishable }}
          PROMOTION_VALIDATE_ONLY: ${{ inputs.validate_only == true }}
        run: node orchestrator/scripts/promotion/verify-public-outcome.mjs verify public-outcome-intent-burrowAuditor.json public-outcome-burrowAuditor.json burrowAuditor
      - name: Check exact public Plug-ins outcome once
        if: ${{ always() && needs.stage.outputs.publishable == 'true' && steps.restore.outcome == 'success' && steps.restore.outputs.publish_auditor_and_plug == 'true' }}
        env:
          PROMOTION_PUBLISHABLE: ${{ needs.stage.outputs.publishable }}
          PROMOTION_VALIDATE_ONLY: ${{ inputs.validate_only == true }}
        run: node orchestrator/scripts/promotion/verify-public-outcome.mjs verify public-outcome-intent-burrowPlug.json public-outcome-burrowPlug.json burrowPlug
      - name: Upload public outcome receipt even on publication or check failure
        if: ${{ always() && hashFiles('public-outcome.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-outcome-${{ needs.stage.outputs.release_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-outcome.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload companion outcome receipts even on publication or check failure
        if: ${{ always() && hashFiles('public-outcome-burrowAuditor.json', 'public-outcome-burrowPlug.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-companion-outcomes-${{ needs.stage.outputs.release_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public-outcome-burrowAuditor.json
            public-outcome-burrowPlug.json
          if-no-files-found: error
          retention-days: 7
