name: Native installer
on:
  pull_request:
    paths: ['install.sh', 'scripts/install/**', 'scripts/assembly/**', 'scripts/promotion/**', '.github/workflows/assemble.yml', '.github/workflows/native-installer.yml', '.github/workflows/daily-public-promotion.yml']
  push:
    branches: [main]
    paths: ['install.sh', 'scripts/install/**', 'scripts/assembly/**', 'scripts/promotion/**', '.github/workflows/assemble.yml', '.github/workflows/native-installer.yml', '.github/workflows/daily-public-promotion.yml']
permissions:
  contents: read
jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check shell syntax
        run: sh -n install.sh
      - name: Test isolated installer, assembly and promotion contracts
        run: node --test scripts/install/*.test.mjs scripts/assembly/*.test.mjs scripts/promotion/*.test.mjs
