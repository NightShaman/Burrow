site_name: BURROW
site_description: Install Burrow, create your first agent, and use the public release day to day
site_url: https://burrow-docs.blissful-psychosis.com/
repo_url: https://github.com/GoblinKing-Burrow/Burrow
repo_name: GoblinKing-Burrow/Burrow
edit_uri: ""
strict: true
copyright: Burrow · Blissful-Psychosis · Sustainable Use License

theme:
  name: material
  language: en
  logo: assets/burrow-logo.png
  favicon: assets/burrow-logo.png
  font: false
  features: [navigation.tabs, navigation.sections, navigation.indexes, navigation.top, navigation.footer, search.suggest, search.highlight, content.code.copy]
plugins: [search]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
validation:
  nav: { omitted_files: warn, not_found: warn, absolute_links: warn }
  links: { not_found: warn, anchors: warn, absolute_links: warn, unrecognized_links: warn }
extra_css: [assets/stylesheets/extra.css?v=20261019-full-width-hero]
nav:
  - Home: index.md
  - User guide:
      - Install Burrow: guide/installation.md
      - Your first agent: guide/first-agent.md
      - Everyday use: guide/everyday-use.md
      - Models and connections: guide/models.md
      - Tools, Node Goblin, and mods: guide/tools-and-mods.md
      - Skills and memory: guide/skills-and-memory.md
      - Projects and tasks: guide/tasks.md
      - Updates, backups, and help: guide/maintenance.md
  - About this release:
      - Source and coverage: project/source-map.md
      - Build this documentation: development/documentation.md
  - Technical reference:
      - Start:
          - Core concepts: concepts/core-concepts.md
          - Interface guide: concepts/interface.md
      - Security:
          - Authentication: security/authentication.md
          - Permissions: security/permissions.md
          - Trust boundaries: security/trust-boundaries.md
      - Reference:
          - Configuration: reference/configuration.md
          - API:
              - Overview: reference/api.md
              - Mods: reference/api/mods.md
      - Develop:
          - Developer setup: development/setup.md
          - Repository structure: development/repository.md
          - Extensions: development/extensions.md
          - Third-party mod contract: development/mod-contract.md
          - Releases and versioning: development/releases.md
      - Project:
          - Known limitations: project/known-limitations.md
